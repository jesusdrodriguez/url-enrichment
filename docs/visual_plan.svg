<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 996" width="1100" height="996" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>URL enrichment prototype: development plan</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 14px; fill: #475569; }
      .head  { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: 1.5px; }
      .card  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lbl   { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
      .code  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .codet { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #0f766e; }
      .tname { font-size: 14px; font-weight: 700; }
      .tnote { font-size: 12.5px; fill: #64748b; }
      .conn  { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .num   { fill: #0f766e; }
      .numt  { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .st    { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sd    { font-size: 13px; fill: #475569; }
      .why   { font-size: 13.5px; fill: #422006; }
      .whyb  { font-weight: 700; fill: #92400e; }
      .tick  { fill: #d97706; font-size: 13px; }
      .fbox  { fill: #f0fdfa; stroke: #5eead4; stroke-width: 1.5; }
      .fbig  { font-size: 26px; font-weight: 700; fill: #0f766e; }
      .fsm   { font-size: 13px; fill: #134e4a; }
    </style>
  </defs>

  <rect width="1100" height="996" fill="#f8fafc"/>

  <text x="40" y="52" class="title">URL Enrichment Prototype: Development Plan</text>
  <text x="40" y="78" class="sub">Four stages in build order. Each one lists the choice made and the alternative it was chosen over.</text>

  <!-- ================= The core idea ================= -->
  <text x="40" y="122" class="head">THE CORE IDEA: ONE URL, THREE LOOKUP KEYS</text>

  <!-- raw input -->
  <rect x="40" y="136" width="440" height="58" rx="10" class="card"/>
  <text x="56" y="157" class="lbl">INPUT LINE 4 (AS READ)</text>
  <text x="56" y="180" class="code">HTTPS://WWW.company-001.test/products/item-1#details</text>

  <line x1="260" y1="196" x2="260" y2="226" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="272" y="216" class="tnote">normalize: lowercase host, drop fragment</text>

  <!-- normalized -->
  <rect x="40" y="230" width="440" height="58" rx="10" class="card"/>
  <text x="56" y="251" class="lbl">NORMALIZED URL (SAME AS LINE 1)</text>
  <text x="56" y="274" class="code">https://www.company-001.test/products/item-1</text>

  <!-- connectors to targets -->
  <path d="M480,259 C520,259 520,165 556,165" class="conn" marker-end="url(#arrow)"/>
  <path d="M480,259 C520,259 520,227 556,227" class="conn" marker-end="url(#arrow)"/>
  <path d="M480,259 C520,259 520,289 556,289" class="conn" marker-end="url(#arrow)"/>

  <!-- targets -->
  <g>
    <rect x="560" y="136" width="500" height="56" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <text x="576" y="157" class="tname" fill="#0f766e">Registration</text>
    <text x="1044" y="157" text-anchor="end" class="tnote">who owns it? · eTLD+1 · shared by 9 input lines</text>
    <text x="576" y="180" class="codet">company-001.test</text>
  </g>
  <g>
    <rect x="560" y="198" width="500" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="576" y="219" class="tname" fill="#1d4ed8">TLS certificate</text>
    <text x="1044" y="219" text-anchor="end" class="tnote">what cert is served? · host:port</text>
    <text x="576" y="242" class="codet" style="fill:#1d4ed8">www.company-001.test:443</text>
  </g>
  <g>
    <rect x="560" y="260" width="500" height="56" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="576" y="281" class="tname" fill="#b91c1c">Reputation</text>
    <text x="1044" y="281" text-anchor="end" class="tnote">is this exact URL bad? · full URL</text>
    <text x="576" y="304" class="codet" style="fill:#b91c1c">https://www.company-001.test/products/item-1</text>
  </g>

  <!-- ================= Build plan ================= -->
  <text x="40" y="364" class="head">BUILD PLAN</text>

  <g stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="68" y1="470" x2="68" y2="486"/>
    <line x1="68" y1="594" x2="68" y2="610"/>
    <line x1="68" y1="718" x2="68" y2="734"/>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(0,378)">
    <rect x="40" y="0" width="1020" height="90" rx="10" class="card"/>
    <circle cx="68" cy="28" r="14" class="num"/><text x="68" y="33" text-anchor="middle" class="numt">1</text>
    <text x="94" y="33" class="st">Understand the data</text>
    <text x="94" y="56" class="sd">Read all 1,000 lines and list every kind of variant: case, ports, tracking params, IDN, IPs, defanged URLs, junk.</text>
    <text x="94" y="82" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">Rules from the real data</tspan>, not guesses: it showed 7 repeating URL patterns and a 29-line broken section.</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(0,490)">
    <rect x="40" y="0" width="1020" height="106" rx="10" class="card"/>
    <circle cx="68" cy="28" r="14" class="num"/><text x="68" y="33" text-anchor="middle" class="numt">2</text>
    <text x="94" y="33" class="st">Normalize each line, then derive its lookup keys</text>
    <text x="94" y="56" class="sd">clean → refang → scheme → host → port → path → query → drop fragment. Every step is saved as a flag.</text>
    <text x="94" y="80" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">Hand-written rules</tspan>, not a normalizer library: every decision is visible, flagged and tested.</text>
    <text x="94" y="98" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">Merge only what is guaranteed identical</tspan>: a wrong merge returns another URL's result. Path case is kept.</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(0,614)">
    <rect x="40" y="0" width="1020" height="106" rx="10" class="card"/>
    <circle cx="68" cy="28" r="14" class="num"/><text x="68" y="33" text-anchor="middle" class="numt">3</text>
    <text x="94" y="33" class="st">Store everything and plan the lookups</text>
    <text x="94" y="56" class="sd">raw_inputs → normalized_urls → url_targets → lookup_targets → lookup_results  (SQLite, deduplicated twice)</text>
    <text x="94" y="80" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">SQLite</tspan>, not JSON files: UNIQUE constraints dedupe across runs, and joins give the trace back to each line.</text>
    <text x="94" y="98" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">The plan is a query</tspan>, not a queue table: pending = no result, or only an error. Nothing can drift out of sync.</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(0,738)">
    <rect x="40" y="0" width="1020" height="106" rx="10" class="card"/>
    <circle cx="68" cy="28" r="14" class="num"/><text x="68" y="33" text-anchor="middle" class="numt">4</text>
    <text x="94" y="33" class="st">Look up, link results back, and prove it</text>
    <text x="94" y="56" class="sd">Mock providers · rate limit and --max budget · per-line report, trace, JSON export · 72 tests · run the file twice</text>
    <text x="94" y="80" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">One provider interface</tspan>, not hard-wired calls: a real client replaces a mock without touching the pipeline.</text>
    <text x="94" y="98" class="why"><tspan class="tick">▸ </tspan><tspan class="whyb">Results stored once per target</tspan>, not copied per line: "ok" and "not_found" are reused; "error" is retried.</text>
  </g>

  <!-- ================= Results ================= -->
  <text x="40" y="880" class="head">ON THE EXERCISE FILE</text>
  <g transform="translate(0,892)">
    <rect x="40"  y="0" width="225" height="86" rx="10" class="fbox"/>
    <text x="152" y="36" text-anchor="middle" class="fbig">1,000</text>
    <text x="152" y="58" text-anchor="middle" class="fsm">input lines</text>
    <text x="152" y="76" text-anchor="middle" class="fsm" style="font-size:12px">987 accepted · 12 rejected · 1 skipped</text>

    <rect x="305" y="0" width="225" height="86" rx="10" class="fbox"/>
    <text x="417" y="36" text-anchor="middle" class="fbig">897</text>
    <text x="417" y="58" text-anchor="middle" class="fsm">distinct URLs</text>

    <rect x="570" y="0" width="225" height="86" rx="10" class="fbox"/>
    <text x="682" y="36" text-anchor="middle" class="fbig">1,910</text>
    <text x="682" y="58" text-anchor="middle" class="fsm">lookups, instead of 2,887</text>
    <text x="682" y="76" text-anchor="middle" class="fsm">270 reg · 743 TLS · 897 reputation</text>

    <rect x="835" y="0" width="225" height="86" rx="10" class="fbox"/>
    <text x="947" y="36" text-anchor="middle" class="fbig">0</text>
    <text x="947" y="58" text-anchor="middle" class="fsm">lookups when the</text>
    <text x="947" y="76" text-anchor="middle" class="fsm">same file is run again</text>

    <g stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="267" y1="43" x2="301" y2="43"/>
      <line x1="532" y1="43" x2="566" y2="43"/>
      <line x1="797" y1="43" x2="831" y2="43"/>
    </g>
  </g>
</svg>
